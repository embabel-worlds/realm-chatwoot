# Five producers, all through Chatwoot's own application API — never its database.
#
# WHICH DOOR ANSWERS WHAT, and what it costs. The desk door reads a whole status (every case on
# the desk in one page walk); the account door asks Chatwoot for ONE company's cases; the text door
# asks Chatwoot which conversations contain some words; the thread door reads one conversation's
# messages. A question about one company costs that company's cases, not the desk's:
#
#   MATCH (c:SupportCase) WHERE c.accountKey = 'acme.com'          one filter call (the account door)
#   MATCH (:ChatwootDesk {status:'all'})-[:HAS_CASE]->(c)           every case, 25 to a page
#
# The desk door asks Chatwoot's filter, so a window on the business days (`openedOn > '2026-09-01'`)
# goes to Chatwoot too; see the door for which comparisons can, and which it does not send.
#
# The engine takes the account door for the first form by itself, because the join declares
# `materializedKeyField: accountKey` (types/chatwoot.yml).
#
# The three conversation producers carry the SAME `project` and `compute`, written out three times:
# the host reads this file without resolving YAML anchors, so there is no way to say it once. Keep
# them identical. The vocabulary's names are on the left, Chatwoot's on the right.
#
# PAGE SIZE. Every Chatwoot conversation listing is 25 to a page, fixed (CONVERSATION_RESULTS_PER_PAGE
# on the server, Kaminari's default on the filter), and takes no size argument, so `size: 25` is the
# source's maximum and `maxPages` is the ceiling.
#
# RATE LIMIT. Chatwoot throttles per client IP (Rack::Attack `req/ip`, 3,000 a minute by default,
# RACK_ATTACK_LIMIT on the server). A sweep of a large desk is tens of pages; a thread fan-out is one
# call per conversation. Both are why the narrow doors exist and why the thread is cached long.

# The desk by status — the scan door. It asks Chatwoot's FILTER endpoint, not the plain list, because
# the filter is the only one that takes a date: the list takes a status and nothing a case carries,
# so "cases opened after September" used to read every page of the desk (69 calls for 1,717 cases)
# and drop most of them in the graph. Through the filter the window goes to Chatwoot and only its
# own cases come back (163 cases, 7 calls).
#
# THE KEY IS CHATWOOT'S OWN STATUS WORD, sent as the first clause. Each word asks exactly what the
# list's `status=` did, verified on a running desk word for word (all 1,717, open 1,692, resolved 25,
# pending 0, snoozed 0, each equal to the list's all_count):
#   - 'all' is a status the filter itself understands as every status, so the door needs no clause
#     left out and no second shape for it;
#   - 'pending' is Chatwoot's pending ALONE and 'snoozed' Chatwoot's snoozed alone. The graph's
#     `status = 'pending'` is both (see `compute`), which is why ChatwootDesk keeps Chatwoot's words
#     rather than the graph's.
- name: chatwootConversationsByStatus
  kind: api
  operation: chatwootConversationsFilter
  records: "$.payload[*]"
  keyArg: "payload.0.values"
  # One status per call: a page walk belongs to one status, and 'all' is a status of its own.
  batchSafe: false
  echoKeyAs: deskStatus
  args:
    payload:
      - attribute_key: status
        filter_operator: equal_to
        values: []
        custom_attribute_type: null
  # The filter answers in last-activity order, newest first, and takes no sort argument (read in the
  # v4.17.1 source: FilterService#conversations is `sort_on_last_activity_at`, whatever is asked).
  # That order MOVES: a conversation with a new message while the pages are being read jumps to the
  # front, and is missed if the front page has been read. The pages after the first are fetched
  # concurrently, once the first page's total says how many there are, so the window is the few
  # seconds of one walk; what can go missing is only a conversation that changed during it, and a
  # page boundary that shifts reads one case twice, which identity folds into one. The plain list
  # could be read in creation order, which does not move, but it cannot be told a date, and every
  # dated question paid for the whole desk to avoid that window.
  orderedBy: [{ property: lastActivityAt, descending: true }]
  # 2,000 pages is 50,000 conversations: a mid-market desk's history, read once per cache window. The
  # join's maxFanoutTotal matches it, or the engine would keep only its default 5,000 of what was read.
  paging: { style: page, param: page, size: 25, maxPages: 2000, total: meta.all_count }
  # Each clause is a JSON object appended after the status clause, and `query_operator` on the
  # PRECEDING clause is how Chatwoot spells AND (see the account door below for what else is fragile).
  #
  # Only what Chatwoot answers EXACTLY as the graph would is pushed, because a pushed filter is
  # trusted: the engine may skip its own comparison and push a LIMIT over what comes back. Each rule
  # was checked on a running desk against the same comparison applied to a full walk.
  pushdown:
    # A status or a priority on the CASE, as on the company door. Only `open` and `resolved`: the
    # graph's `pending` is Chatwoot's pending AND snoozed, so a pending question walks the status and
    # filters in the graph. Each was checked on a running desk: `all` AND status open is 1,692, the
    # list's own open count. A count over a pushed status is Chatwoot's total for exactly that filter,
    # one call (it read 1 for 25 resolved cases on hosts before embabel/me#4236).
    - property: status
      op: EQUALS
      valuePattern: "^(open|resolved)$"
      argPath: payload.-
      clause:
        attribute_key: status
        filter_operator: equal_to
        values: ["{value}"]
        custom_attribute_type: null
      linkPrevious: { query_operator: AND }
    - property: priority
      op: EQUALS
      valuePattern: "^(urgent|high|medium|low)$"
      argPath: payload.-
      clause:
        attribute_key: priority
        filter_operator: equal_to
        values: ["{value}"]
        custom_attribute_type: null
      linkPrevious: { query_operator: AND }
    #
    # THE BUSINESS DAYS. The desk defines opened_on, updated_on and closed_on as DATE attributes, and
    # Chatwoot compares a date attribute by the day, strictly: `is_greater_than` is `>` and
    # `is_less_than` is `<`, a case without the attribute matching neither. The graph holds the same
    # days as 'YYYY-MM-DD' text, whose order is the days' order, so a bare day written after `>` or
    # `<` keeps the same cases at both ends (checked at the first quartile, the median and the last
    # day of each attribute, the bound day itself included). The pattern takes a bare day only: a
    # date-time names an instant, which a comparison by the day cannot keep exactly. Its capture
    # group is load-bearing: the engine sends group 1, and a pattern without one refuses every value.
    #
    # `>=` and `<=` reach Chatwoot too, through `granularity: day`: Chatwoot has no inclusive
    # comparison, so the host sends `>= D` as `> D-1` and `<= D` as `< D+1` on a BARE day, which
    # keeps the same cases over stored days. A bound with a time of day is not moved, and stays in
    # the graph. Equality on a day is not pushed: the filter has no `equal_to` on a date that the
    # engine could be sure means the same day.
    - { property: openedOn, op: GREATER_THAN, valuePattern: '^(\d{4}-\d{2}-\d{2})$', argPath: payload.-,
        clause: { attribute_key: opened_on, filter_operator: is_greater_than, values: ["{value}"], custom_attribute_type: conversation_attribute },
        granularity: day, linkPrevious: { query_operator: AND } }
    - { property: openedOn, op: LESS_THAN, valuePattern: '^(\d{4}-\d{2}-\d{2})$', argPath: payload.-,
        clause: { attribute_key: opened_on, filter_operator: is_less_than, values: ["{value}"], custom_attribute_type: conversation_attribute },
        granularity: day, linkPrevious: { query_operator: AND } }
    - { property: updatedOn, op: GREATER_THAN, valuePattern: '^(\d{4}-\d{2}-\d{2})$', argPath: payload.-,
        clause: { attribute_key: updated_on, filter_operator: is_greater_than, values: ["{value}"], custom_attribute_type: conversation_attribute },
        granularity: day, linkPrevious: { query_operator: AND } }
    - { property: updatedOn, op: LESS_THAN, valuePattern: '^(\d{4}-\d{2}-\d{2})$', argPath: payload.-,
        clause: { attribute_key: updated_on, filter_operator: is_less_than, values: ["{value}"], custom_attribute_type: conversation_attribute },
        granularity: day, linkPrevious: { query_operator: AND } }
    - { property: closedOn, op: GREATER_THAN, valuePattern: '^(\d{4}-\d{2}-\d{2})$', argPath: payload.-,
        clause: { attribute_key: closed_on, filter_operator: is_greater_than, values: ["{value}"], custom_attribute_type: conversation_attribute },
        granularity: day, linkPrevious: { query_operator: AND } }
    - { property: closedOn, op: LESS_THAN, valuePattern: '^(\d{4}-\d{2}-\d{2})$', argPath: payload.-,
        clause: { attribute_key: closed_on, filter_operator: is_less_than, values: ["{value}"], custom_attribute_type: conversation_attribute },
        granularity: day, linkPrevious: { query_operator: AND } }
    # NOT pushed: createdAt and lastActivityAt. Chatwoot filters them by the DAY (`created_at::date`)
    # and the graph holds them as epoch seconds, so no bound written in the graph's terms names the
    # day Chatwoot would compare. A business-day question uses openedOn, which is the truth for a
    # desk loaded from another system anyway (see the types' note on the two clocks).
  # "How many" is `meta.all_count` on the FIRST response, so it costs one call rather than a walk.
  # A count over a pushed window is read from the window's own pages instead (7 calls for 163 cases,
  # measured): the engine does not take the count off the envelope when a filter went with it.
  # `records: "$"` reads the ENVELOPE: a conversation carries no total (me#1402).
  aggregates:
    - measure: count
      valueField: meta.all_count
      records: "$"
  project:
    id: id
    accountKey: custom_attributes.account_key
    subject: custom_attributes.subject
    status: status
    priority: priority
    kind: custom_attributes.kind
    requesterEmail: meta.sender.email
    requesterName: meta.sender.name
    requesterCompany: meta.sender.additional_attributes.company_name
    openedOn: custom_attributes.opened_on
    updatedOn: custom_attributes.updated_on
    closedOn: custom_attributes.closed_on
    replyCount: custom_attributes.reply_count
    caseRef: custom_attributes.case_id
    labels: labels
    tags: labels
    waitingSince: waiting_since
    createdAt: created_at
    lastActivityAt: last_activity_at
  compute:
    # The vocabulary's sourceUrl: opens the conversation in Chatwoot. The host is the demo stack's, as
    # realm-odoo's links are; a desk elsewhere changes it here.
    sourceUrl: "'http://localhost:3100/app/accounts/1/conversations/' + toString(r.id)"
    # The vocabulary's three statuses: Chatwoot's `snoozed` is a case waiting on a date, which the
    # vocabulary folds into pending. The desk door still takes Chatwoot's own words, so
    # `(:ChatwootDesk {status:'snoozed'})` asks for exactly the snoozed ones.
    status: "CASE r.status WHEN 'snoozed' THEN 'pending' ELSE r.status END"
  # A desk changes by the minute. A minute old is the most a "what is open" answer should be.
  cache: { kind: ttl, seconds: 60, negativeTtlSeconds: 60 }

# One company's cases, by the company domain the desk records on each conversation (custom attribute
# account_key). Chatwoot's filter takes a `values` array but matches only its FIRST element for a
# custom attribute (verified: two domains in, one domain's conversations out), so this asks one
# company per call.
#
# Chatwoot compares the attribute case-insensitively (LOWER(custom_attributes ->> 'account_key')),
# which can only return MORE than the graph's exact `accountKey = …` keeps, never less, so the graph's
# own comparison stays the answer. It needs the attribute DEFINED on the desk (Settings → Custom
# Attributes, key account_key, type text): Chatwoot silently drops a clause on an undefined
# attribute and answers with every conversation. seed/load_book.py defines it; see the README.
- name: chatwootConversationsByAccount
  kind: api
  operation: chatwootConversationsFilter
  records: "$.payload[*]"
  keyArg: "payload.0.values"
  batchSafe: false
  echoKeyAs: accountKeyAsked
  args:
    payload:
      - attribute_key: account_key
        filter_operator: equal_to
        values: []
        custom_attribute_type: conversation_attribute
  # The filter answers in last-activity order, newest first, and takes no sort argument.
  orderedBy: [{ property: lastActivityAt, descending: true }]
  # One company rarely has more than a page; 40 pages is a thousand cases for one company.
  paging: { style: page, param: page, size: 25, maxPages: 40, total: meta.all_count }
  # Each clause is a JSON object appended to the payload, and `query_operator` on the PRECEDING clause
  # is how the desk spells AND. Verified against a running desk, because the shape is unforgiving:
  # appending without the operator is an HTTP 500, and one on the LAST clause earns "Query operator
  # must be either AND or OR" — so it is written at append time (`linkPrevious`).
  #
  # Worth declaring for more than the page it saves: what the source absorbs is what lets the engine
  # push a LIMIT and ask for a COUNT instead of the records.
  pushdown:
    # Only `open` and `resolved` are pushed. The graph's `pending` is Chatwoot's pending AND snoozed
    # (see `compute`), so asking Chatwoot for 'pending' would lose the snoozed ones. A pending
    # question reads the company's cases and filters in the graph: one company's cases, still small.
    # No IN rule for the same reason: a set naming pending cannot be sent as written.
    - property: status
      op: EQUALS
      valuePattern: "^(open|resolved)$"
      argPath: payload.-
      clause:
        attribute_key: status
        filter_operator: equal_to
        values: ["{value}"]
        custom_attribute_type: null
      linkPrevious: { query_operator: AND }
    # Chatwoot stores priority as the same four words the graph holds, so equality is exact.
    - property: priority
      op: EQUALS
      valuePattern: "^(urgent|high|medium|low)$"
      argPath: payload.-
      clause:
        attribute_key: priority
        filter_operator: equal_to
        values: ["{value}"]
        custom_attribute_type: null
      linkPrevious: { query_operator: AND }
  # "How many open cases does this company have" is `meta.all_count` on the first page: one call.
  aggregates:
    - measure: count
      valueField: meta.all_count
      records: "$"
  project:
    id: id
    accountKey: custom_attributes.account_key
    subject: custom_attributes.subject
    status: status
    priority: priority
    kind: custom_attributes.kind
    requesterEmail: meta.sender.email
    requesterName: meta.sender.name
    requesterCompany: meta.sender.additional_attributes.company_name
    openedOn: custom_attributes.opened_on
    updatedOn: custom_attributes.updated_on
    closedOn: custom_attributes.closed_on
    replyCount: custom_attributes.reply_count
    caseRef: custom_attributes.case_id
    labels: labels
    tags: labels
    waitingSince: waiting_since
    createdAt: created_at
    lastActivityAt: last_activity_at
  compute:
    sourceUrl: "'http://localhost:3100/app/accounts/1/conversations/' + toString(r.id)"
    status: "CASE r.status WHEN 'snoozed' THEN 'pending' ELSE r.status END"
  # Most companies have nothing open, and a clean answer is worth remembering as much as a full one:
  # without a negative TTL every quiet company is asked again on every query.
  cache: { kind: ttl, seconds: 60, negativeTtlSeconds: 60 }

# The conversations whose messages contain some text, found by Chatwoot itself (the list endpoint's
# `q`): one search instead of reading every conversation's thread to look. Chatwoot matches the
# words case-insensitively, anywhere in a customer's or an agent's message (private notes included),
# over the whole history; its own activity lines are not searched.
#
# Read in the v4.17.1 source rather than taken from the docs, and two of its answers differ from the
# plain list: with `q` Chatwoot IGNORES `status`, and its `all_count` is computed after the page is
# cut, so it is not the total. So no status is sent, no `total` is declared (the walk reads pages
# until one comes back short), and no count is read off the envelope.
#
# Chatwoot's other search, /search/messages, is not used: it looks back only three months, and on a
# desk with full-text search switched on it matches whole words rather than text, so it would answer
# a "contains" question with fewer conversations than contain the words.
- name: chatwootConversationsByText
  kind: api
  operation: chatwootConversationsList
  records: "$.data.payload[*]"
  keyArg: q
  batchSafe: false
  echoKeyAs: textAsked
  args:
    assignee_type: all
    sort_by: created_at_asc
  orderedBy: [{ property: createdAt }]
  paging: { style: page, param: page, size: 25, maxPages: 200 }
  # The search takes the text and nothing else a case carries.
  pushdown: []
  project:
    id: id
    accountKey: custom_attributes.account_key
    subject: custom_attributes.subject
    status: status
    priority: priority
    kind: custom_attributes.kind
    requesterEmail: meta.sender.email
    requesterName: meta.sender.name
    requesterCompany: meta.sender.additional_attributes.company_name
    openedOn: custom_attributes.opened_on
    updatedOn: custom_attributes.updated_on
    closedOn: custom_attributes.closed_on
    replyCount: custom_attributes.reply_count
    caseRef: custom_attributes.case_id
    labels: labels
    tags: labels
    waitingSince: waiting_since
    createdAt: created_at
    lastActivityAt: last_activity_at
  compute:
    sourceUrl: "'http://localhost:3100/app/accounts/1/conversations/' + toString(r.id)"
    status: "CASE r.status WHEN 'snoozed' THEN 'pending' ELSE r.status END"
  # Words that match nothing are asked about again too, so the clean answer is remembered as long.
  cache: { kind: ttl, seconds: 120, negativeTtlSeconds: 120 }

# A conversation's thread. The conversation id is in the path, so this is one call per conversation
# by construction — which is why it is keyed so it can be cached for a day.
#
# THE KEY IS THE CONVERSATION AND ITS LAST ACTIVITY (the join's producerKeyFields: [id,
# lastActivityAt]). Chatwoot moves a conversation's last_activity_at to the new message's time on
# EVERY message it records — customer, agent, private note or its own activity line — so a thread
# with a new message is a new key and is read again, and a thread that has not moved is served from
# the cache however long ago it was read. A resolved conversation's thread is therefore read once.
# What the key cannot see is an existing message edited or deleted in place; the day's TTL bounds that.
- name: chatwootMessagesByConversation
  kind: api
  operation: chatwootConversationMessages
  records: "$.payload[*]"
  # The composite arrives as one key per conversation; the second part names no argument the
  # operation declares, so it is not sent — it is in the key only to be in the cache key.
  keyArgs: [conversation_id, lastActivityAt]
  batchSafe: false
  echoKeyAs: conversationKey
  # Load-bearing. With neither argument Chatwoot answers with the LATEST 20 messages only, so every
  # longer thread was silently cut to its last twenty. after=0 with a `before` above the id range is
  # the whole thread, oldest first, up to 1,000 messages in one call (MessageFinder#messages_between).
  args:
    after: 0
    before: 2147483648
  # The thread comes back whole or not at all — the endpoint has no filter — so a `messageType = 0`
  # in a query is always applied graph-side. Declared empty so the engine knows that is the source's
  # shape and not a missing rule.
  pushdown: []
  # A message's body is what a customer wrote, or what an agent wrote to them. Text from outside the
  # business can carry instructions meant for whoever reads it, so a routine that reads it is marked,
  # and anything it then asks a person to approve says it was drafted after reading it.
  untrusted: customer-written messages
  project:
    id: id
    body: content
    messageType: message_type
    internal: private
    sentAt: created_at
  # The vocabulary's SupportMessage: fromCustomer is Chatwoot's message_type 0 (1 is an agent, 2
  # Chatwoot's own activity line, 3 a template), and sentOn the day, from its epoch seconds.
  compute:
    fromCustomer: "r.messageType = 0"
    sentOn: "toString(date(datetime({epochSeconds: r.sentAt})))"
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }
