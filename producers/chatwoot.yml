# Three producers, all through Chatwoot's own application API — never its database.
#
# The two conversation producers carry the SAME `project`, written out twice: the host reads
# this file without resolving YAML anchors, so there is no way to say it once. Keep them
# identical. The vocabulary's names are on the left, Chatwoot's on the right. `project` renames; it does not compute, which is why types/chatwoot.yml lists what
# the contract asks for and this realm cannot yet give.

# The desk by status — the scan door. The anchor key IS Chatwoot's own `status` argument, so
# the door needs no invented parameter and the narrowing happens at the source.
- name: chatwootConversationsByStatus
  kind: api
  operation: chatwootConversationsList
  records: "$.data.payload[*]"
  keyArg: status
  # One status per call: a page walk belongs to one status, and 'all' is a status of its own.
  batchSafe: false
  echoKeyAs: deskStatus
  args:
    assignee_type: all
    # Load-bearing. Chatwoot's default order is by last activity, which MOVES while pages are
    # being read: a conversation that is touched between two page reads is seen twice or not
    # at all. Creation order does not move.
    sort_by: created_at_asc
  # Chatwoot's page size is fixed at 25 and it has no size argument to set.
  # Chatwoot's page size is fixed at 25 and it has no size argument, so maxPages IS the ceiling:
  # 40 pages was 1,000 conversations, and this desk holds 1,521 open. A walk stopped at 1,000 and
  # said so (PARTIAL_RESULT), which is honest but still 521 cases short of every per-account
  # question asked through this door. 200 pages is 5,000, a real desk's order of magnitude.
  #
  # The COUNT is unaffected either way — it reads `all_count` off the envelope and has no ceiling,
  # which is why "how many open cases" answered 1,521 exactly while the walk could only see 1,000.
  # `total`: the list answer carries the desk's count on every page, so after page one the walk
  # knows how many pages remain and fetches them concurrently (me#1539) — 29 pages of open cases
  # cost about one page's latency instead of 29.
  paging: { style: page, param: page, size: 25, maxPages: 200, total: data.meta.all_count }
  # "How many are open" is in the FIRST response — `all_count` beside the page — so it costs
  # one call rather than walking forty. It matters more here than anywhere else in the realm:
  # 25 x 40 is a hard ceiling of 1,000 conversations, above which the walk returns a
  # PARTIAL_RESULT and its number is a floor. The count has no ceiling and is exact.
  #
  # `records: "$"` reads the ENVELOPE. The producer's own path selects a conversation, and a
  # conversation carries no total — without this the measure resolves to null (me#1402).
  aggregates:
    - measure: count
      valueField: data.meta.all_count
      records: "$"
  project:
    id: id
    accountKey: custom_attributes.account_key
    subject: custom_attributes.subject
    status: status
    priority: priority
    kind: custom_attributes.kind
    requesterEmail: meta.sender.email
    requesterName: meta.sender.name
    requesterCompany: meta.sender.additional_attributes.company_name
    openedOn: custom_attributes.opened_on
    updatedOn: custom_attributes.updated_on
    closedOn: custom_attributes.closed_on
    replyCount: custom_attributes.reply_count
    caseRef: custom_attributes.case_id
    labels: labels
    waitingSince: waiting_since
  cache: { kind: ttl, seconds: 60, negativeTtlSeconds: 60 }

# One account's cases, by the company domain the desk records on each conversation. Chatwoot's
# filter takes a `values` array but matches only its FIRST element (verified: two domains in,
# one domain's conversations out), so this asks one account per call and says so.
- name: chatwootConversationsByAccount
  kind: api
  operation: chatwootConversationsFilter
  records: "$.payload[*]"
  keyArg: "payload.0.values"
  batchSafe: false
  echoKeyAs: accountKeyAsked
  args:
    payload:
      - attribute_key: account_key
        filter_operator: equal_to
        values: []
        custom_attribute_type: conversation_attribute
  paging: { style: page, param: page, size: 25, maxPages: 20, total: meta.all_count }
  # A `WHERE c.status IN [...]` on the query reaches the DESK instead of being applied after the
  # fetch. Structured rather than a text qualifier because this filter is JSON: each payload clause
  # is an object, and `query_operator` on the PRECEDING one is how the desk spells AND.
  #
  # Verified against a running desk, because the shape is unforgiving: appending without the
  # operator is an HTTP 500, and putting one on the LAST clause earns "Query operator must be
  # either AND or OR" — so it cannot be declared statically here, only written at append time.
  #
  # Worth declaring for more than the page it saves: what the source absorbs is what lets the
  # engine push a LIMIT and ask for a COUNT instead of the records. An undeclared filter costs a
  # call per account.
  pushdown:
    - property: status
      op: IN
      argPath: payload.-
      clause:
        attribute_key: status
        filter_operator: equal_to
        values: "{values}"
        custom_attribute_type: null
      linkPrevious: { query_operator: AND }
    - property: status
      op: EQUALS
      argPath: payload.-
      clause:
        attribute_key: status
        filter_operator: equal_to
        values: ["{value}"]
        custom_attribute_type: null
      linkPrevious: { query_operator: AND }
  project:
    id: id
    accountKey: custom_attributes.account_key
    subject: custom_attributes.subject
    status: status
    priority: priority
    kind: custom_attributes.kind
    requesterEmail: meta.sender.email
    requesterName: meta.sender.name
    requesterCompany: meta.sender.additional_attributes.company_name
    openedOn: custom_attributes.opened_on
    updatedOn: custom_attributes.updated_on
    closedOn: custom_attributes.closed_on
    replyCount: custom_attributes.reply_count
    caseRef: custom_attributes.case_id
    labels: labels
    waitingSince: waiting_since
  # Most accounts have no open case, and a clean answer is worth remembering as much as a
  # full one: without a negative TTL every quiet account is asked again on every query.
  cache: { kind: ttl, seconds: 60, negativeTtlSeconds: 60 }

# A conversation's thread. The conversation id is part of the path, so this is one call per
# conversation by construction.
- name: chatwootMessagesByConversation
  kind: api
  keyType: int
  operation: chatwootConversationMessages
  records: "$.payload[*]"
  # STRING mode, not list mode: `keyArg` would hand the path a JSON list, and Chatwoot was
  # asked for conversation "[182]" (a 404, reported honestly as a missing key). The template
  # renders the one key of each call into the path as itself.
  keyTemplate: "{key}"
  args:
    conversation_id: "{keys}"
  batchSafe: false
  echoKeyAs: conversationKey
  # A message's body is what a customer wrote, or what an agent wrote to them. Text from outside the
  # business can carry instructions meant for whoever reads it, so a routine that reads it is marked,
  # and anything it then asks a person to approve says it was drafted after reading it.
  untrusted: customer-written messages
  project:
    id: id
    body: content
    messageType: message_type
    internal: private
    sentAt: created_at
  cache: { kind: ttl, seconds: 60, negativeTtlSeconds: 60 }
