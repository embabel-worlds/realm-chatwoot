name: chatwoot
description: >-
  Chatwoot, the open source customer support inbox, through its OWN application API — never
  the database. A conversation is a SupportCase and a message a SupportMessage of the
  business vocabulary (realm-business-vocabulary, installed first), so a question asked about
  support cases is answered here without naming Chatwoot. Every type is virtual: nothing is
  mirrored, and a change made in Chatwoot's own UI is what the next query sees.
version: 0.1.0
# Works and reconciles against Chatwoot, but the realms that make it useful are still being
# built, and part of the vocabulary's contract cannot be met yet (see the README).
maturity: experimental
author: Rod Johnson
category: customers
tags:
  - integrations
  - support
